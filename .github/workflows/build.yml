name: Build OpenWrt Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build OpenWrt package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OpenWrt Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync unzip zlib1g-dev \
            file wget qemu-utils

      - name: Download OpenWrt SDK
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            SDK_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
          elif [ "${{ matrix.arch }}" = "aarch64_generic" ]; then
            SDK_URL="https://downloads.openwrt.org/snapshots/targets/rockchip/armv8/"
          else
            echo "Unsupported architecture"
            exit 1
          fi

          # Find the SDK filename
          SDK_TARBALL=$(curl -sL $SDK_URL/sha256sums | grep "openwrt-sdk" | head -n 1 | awk '{print $2}' | sed 's/^\*//')

          if [ -z "$SDK_TARBALL" ]; then
            echo "Could not find SDK tarball for ${{ matrix.arch }}"
            exit 1
          fi

          echo "Downloading $SDK_URL/$SDK_TARBALL"
          wget -q "$SDK_URL/$SDK_TARBALL"
          tar xf $SDK_TARBALL
          rm $SDK_TARBALL

          SDK_DIR=$(ls -d openwrt-sdk-* | head -n 1)
          mv $SDK_DIR openwrt-sdk
          echo "SDK extracted to openwrt-sdk"

      - name: Prepare Feeds and Dependencies
        run: |
          cd openwrt-sdk

          # Update and install feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Create package directory
          mkdir -p package/luci-app-homeproxy

          # Copy source code (excluding openwrt-sdk itself to avoid recursive copying)
          cd ..
          rsync -av --exclude='openwrt-sdk' ./ openwrt-sdk/package/luci-app-homeproxy/
          cd openwrt-sdk

          # Generate config
          make defconfig

          # Configure as APK since user requested apk package in message (via CONFIG_USE_APK=y support in snapshots)
          if grep -q "CONFIG_USE_APK" .config; then
            sed -i 's/# CONFIG_USE_APK is not set/CONFIG_USE_APK=y/g' .config
            echo "CONFIG_USE_APK=y" >> .config
          else
            echo "CONFIG_USE_APK=y" >> .config
          fi

          echo "CONFIG_PACKAGE_luci-app-homeproxy=m" >> .config

          # Regenerate config with new settings
          make defconfig

      - name: Compile Package
        run: |
          cd openwrt-sdk

          # Build the package
          make package/luci-app-homeproxy/compile V=s

      - name: Find and Organize Packages
        run: |
          cd openwrt-sdk

          mkdir -p ../artifacts

          # Look for apk first
          find bin/ -name "*.apk" -type f -exec cp {} ../artifacts/ \;

          # Look for ipk as fallback
          find bin/ -name "*.ipk" -type f -exec cp {} ../artifacts/ \;

          echo "Found the following packages:"
          ls -la ../artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-homeproxy-${{ matrix.arch }}
          path: artifacts/*
